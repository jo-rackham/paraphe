# Deployment of ONE campaign on a simple server.
#
# ONE image and one process: it serves the pages and the JSON. Published on
# loopback only, behind whatever TLS proxy the host already runs.
#
# Real values live in .env (git-ignored) — see .env.exemple. Nothing
# sensitive may be written in this file, it is versioned.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paraphe
      # Mandatory: on a VPS, a database with a guessed password is a leak of
      # the team's nominative notes. The check is NOT `:?` here — compose
      # interpolates this file for every command, so `docker compose down`
      # refused to stop a running stack for want of a password it did not
      # need. Left empty, the postgres image refuses to initialise and says
      # so; `task deploy` says it earlier, and better.
      POSTGRES_PASSWORD: ${PARAPHE_PG_PASSWORD}
      POSTGRES_DB: paraphe
    ports:
      # loopback ONLY: `docker compose up` gets run on VPSes with a public
      # IP, and "5432:5432" would open the database to the world there
      - "127.0.0.1:5432:5432"
    volumes:
      - paraphe-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paraphe"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The rate limiter's shared memory. ONE node here: Sentinel on a single
  # host would elect nobody the host outlives, and this compose serves the
  # one-VPS shape — the chart carries the HA topology. Counters only, all
  # TTL'd: no volume, losing them re-opens the rate windows and nothing else.
  valkey:
    image: valkey/valkey:8.1-alpine
    command:
      - valkey-server
      - --requirepass
      - ${PARAPHE_VALKEY_PASSWORD}
      - --maxmemory
      - 64mb
      # under memory pressure a write FAILS — the application then counts
      # per instance, out loud — rather than silently evicting someone
      # else's rate window
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "no"
      - --save
      - ""
    environment:
      # the healthcheck reads it from the environment: a password on a
      # command line would sit in plain sight of every `ps`. valkey-cli 8.1
      # still reads REDISCLI_AUTH; both names are set so nothing moves the
      # day it honours its own.
      REDISCLI_AUTH: ${PARAPHE_VALKEY_PASSWORD}
      VALKEYCLI_AUTH: ${PARAPHE_VALKEY_PASSWORD}
    ports:
      # loopback ONLY, like the database: exposed to a public IP, an open
      # counter store lets anyone reset or exhaust the ceilings
      - "127.0.0.1:6379:6379"
    healthcheck:
      # Answering is not enough — it must REFUSE an unauthenticated caller.
      # `--requirepass ""` (what an unset PARAPHE_VALKEY_PASSWORD interpolates
      # to) starts a Valkey open to every process on the host, and a plain
      # `ping` calls that healthy. PostgreSQL fails closed on an empty
      # password in this same file; this is how Valkey does too, without a
      # `${VAR:?}` that would break `docker compose down`. The api service
      # waits on this health, so an open counter store stops the stack.
      test: ["CMD-SHELL", "env -u REDISCLI_AUTH -u VALKEYCLI_AUTH valkey-cli ping 2>&1 | grep -q NOAUTH && valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The object store holding the campaign logos. ONE node here, like Valkey
  # above and for the same reason: this compose serves the one-VPS shape,
  # and the chart carries the HA topology (three nodes, erasure-coded).
  #
  # Unlike Valkey, this one HAS a volume: its contents are not rebuildable.
  # A lost logo is re-uploadable by its campaign, so it is not in the class
  # of the team's work — but it is not a counter either.
  garage:
    image: dxflrs/garage:v2.3.0
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - paraphe-garage-meta:/var/lib/garage/meta
      - paraphe-garage-data:/var/lib/garage/data
    environment:
      GARAGE_RPC_SECRET: ${PARAPHE_GARAGE_RPC_SECRET}
      # Not published: only garage-init, on this network, ever calls it.
      GARAGE_ADMIN_TOKEN: ${PARAPHE_GARAGE_ADMIN_TOKEN}
    ports:
      # loopback ONLY, like the database and the counters: 3900 is the S3
      # API — write access to every logo — and 3902 the WEB endpoint the
      # browser fetches them from, which the host's TLS proxy publishes.
      # Both are here so that `task api`, run outside Docker, reaches them.
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"
    healthcheck:
      # the S3 API answering, which is what the bootstrap and the app need
      test: ["CMD", "/garage", "status"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One shot, at every start, and idempotent. The layout of a Garage cluster
  # is imperative — there is no declarative form of "this node stores data"
  # — and a bucket that does not exist fails the API's startup check.
  #
  # An alpine, not the garage image: that one is FROM scratch and carries no
  # shell, so nothing built on it can run a multi-step bootstrap. The script
  # talks to the admin API, which is the supported machine interface, and
  # the chart's Job runs the very same file.
  # Lancez-le par `task garage`, jamais par `docker compose up garage-init`
  # tout seul : sans .env, les variables ci-dessous s'interpolent à vide,
  # compose en conclut que la définition de `garage` a changé et RECRÉE le
  # nœud avec un secret RPC vide — il ne redémarre plus, et la commande qui
  # dit « up » vient de détruire une pile qui tournait. `task garage` pose
  # des valeurs locales pour celles que .env ne porte pas.
  garage-init:
    image: alpine:3.22
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./chart/paraphe/files/garage-init.sh:/garage-init.sh:ro
    environment:
      # un seul nœud ici, donc une liste de pairs à un élément
      GARAGE_PEERS: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${PARAPHE_GARAGE_ADMIN_TOKEN}
      MEDIA_BUCKET: paraphe-media
      MEDIA_ACCESS_KEY: ${PARAPHE_MEDIA_ACCESS_KEY}
      MEDIA_SECRET_KEY: ${PARAPHE_MEDIA_SECRET_KEY}
    command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && /garage-init.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      # here and not in .env: `environment` wins over `env_file`, so
      # setting it in .env would have no effect and nobody would see why
      PARAPHE_DATABASE_URL: postgresql://paraphe:${PARAPHE_PG_PASSWORD}@postgres:5432/paraphe
      PARAPHE_VALKEY_URL: valkey://valkey:6379
      PARAPHE_VALKEY_PASSWORD: ${PARAPHE_VALKEY_PASSWORD}
      # Same reason, and one this compose ALWAYS needs: the TLS proxy runs on
      # the host and reaches the container through the Docker gateway, so
      # every request arrives from that one address. Trusting nobody — the
      # right default in the code, and the one the chart overrides too — then
      # attributes the whole deployment to a single rate-limit bucket: sixty
      # wrong passwords lock every volunteer out, and three hosting requests
      # close the public form for the world.
      PARAPHE_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      # The endpoint the APPLICATION writes to, inside this network. The
      # origin the BROWSER reads from is PARAPHE_MEDIA_PUBLIC_URL in .env —
      # two different addresses for the same bucket, and confusing them
      # produces a logo the server stores and no page can display.
      PARAPHE_MEDIA_ENDPOINT: http://garage:3900
      PARAPHE_MEDIA_BUCKET: paraphe-media
      PARAPHE_MEDIA_REGION: garage
    ports:
      # loopback ONLY, like the database: DEPLOYMENT.md prescribes this
      # compose on a public-IP VPS behind a TLS proxy, and "8047:8047" would
      # expose the sign-in form in the clear there, bypassing the
      # certificate.
      - "127.0.0.1:8047:8047"
    env_file:
      # absent = the app starts and says clearly what is missing, rather
      # than failing `docker compose config`
      - path: .env
        required: false
    restart: unless-stopped


volumes:
  paraphe-pg:
  paraphe-garage-meta:
  paraphe-garage-data:
