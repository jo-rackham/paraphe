name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # called by release.yml: nothing gets published without passing through here
  workflow_call:

permissions:
  contents: read

# A run superseded by a newer push has nothing left to prove, except on main
# where every commit's result is a record of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: 🧹 lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: TypeScript, format and lint
        run: pnpm exec biome check .

      # The linters run from their own images rather than through wrapper
      # actions. Two reasons, and the second is the one that matters: the
      # version is the one devbox.json pins, so a clone and the CI report the
      # same findings; and there is no third-party action to pin by commit,
      # hence no chance of pinning one to a commit that does not exist —
      # which a 40-hex string nobody resolves would look exactly like.
      # The REPOSITORY is mounted, not api/: .golangci.yml lives at the root,
      # and golangci-lint finds a configuration by walking up from its working
      # directory — which stops at the mount point. Mounting api/ alone left
      # the container with the DEFAULT rules, so the CI reported six findings
      # the declared configuration excludes on purpose (errcheck and SA1019 in
      # the guards, each with its reason written down). A linter enforcing
      # something other than what the repository declares is worse than no
      # linter: the clone is green and the CI is red, and neither is wrong.
      - name: Go
        run: |
          docker run --rm -v "$PWD:/src" -w /src/api \
            golangci/golangci-lint:v2.12.2 golangci-lint run

      # api/vendor is committed so the image build downloads nothing. Left to
      # drift, the build compiles something other than what go.mod names, and
      # nothing says so until a dependency's behaviour differs.
      - name: The vendored modules match go.mod
        working-directory: api
        run: |
          go mod vendor
          if ! git diff --exit-code -- vendor go.mod go.sum; then
            echo "::error::api/vendor has drifted from go.mod — run go mod vendor and commit"
            exit 1
          fi

      - name: Workflows, shell scripts and Dockerfiles
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
          docker run --rm -i hadolint/hadolint:v2.14.0-alpine < api/Dockerfile
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # git ls-files respects .gitignore by construction, where a find
          # needs one exclusion per directory anybody ever creates
          git ls-files -z '*.sh' ':!:api/vendor' | xargs -0 -r shellcheck

      # outils/deploiement.test.ts refuses an action referenced by a movable
      # tag, and it checks the SHAPE: forty hexadecimal characters. It cannot
      # check that the commit EXISTS, nor that the `# vX.Y.Z` beside it names
      # the release that commit actually is — a plausible string satisfies it
      # either way, and the run then fails on a reference nobody can resolve,
      # or pins a version other than the one the comment promises. That needs
      # the network, which is here and not in the suite.
      - name: Every pinned action resolves, and to the version its comment names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=0
          while read -r repo sha version; do
            if ! gh api "repos/$repo/commits/$sha" --jq .sha >/dev/null 2>&1; then
              echo "::error::$repo@$sha does not exist"
              bad=1
              continue
            fi
            tags=$(gh api "repos/$repo/tags" --paginate \
              --jq ".[] | select(.commit.sha==\"$sha\") | .name" 2>/dev/null || true)
            if [ -n "$version" ] && ! printf '%s\n' "$tags" | grep -qx "$version"; then
              echo "::error::$repo@$sha is not $version (tags: ${tags:-none})"
              bad=1
            fi
          done < <(grep -rhoE 'uses:[[:space:]]*[^./][^@]+@[0-9a-f]{40}([[:space:]]*#[[:space:]]*\S+)?' \
                     .github/workflows .github/actions \
                   | sed -E 's|uses:[[:space:]]*||; s|@| |; s|[[:space:]]*#[[:space:]]*| |')
          exit $bad

  outils:
    name: 🧪 tools
    # crossing of the open sources, mass mailing, and faithfulness of the
    # difflib port the targeted-mayor list depends on
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: outils
    # The invariants on the REAL outputs live in their own workflow
    # (donnees.yml): they need the open sources, and this job — which
    # release.yml goes through — must not depend on data.gouv.fr being up.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Types
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm exec vitest run

  api:
    name: 🐹 api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paraphe
          POSTGRES_PASSWORD: paraphe
          POSTGRES_DB: paraphe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paraphe"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # No password: a GitHub service container cannot override the image's
      # command, and the image only takes requirepass through one. Localhost
      # of an ephemeral runner; the authenticated path is exercised by the
      # sentinel drill below and by local runs.
      valkey:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Format
        # `*.go` and not `.`: the module is flat, and `.` walks vendor/,
        # whose formatting belongs to other people.
        # single-quoted: the ':' in the message would make YAML read the
        # command as a mapping, and the whole workflow would be rejected
        run: 'gofmt -l ./*.go | (! grep .) || (echo "gofmt : fichiers non formatés"; exit 1)'

      - run: go vet ./...

      - name: Tests
        # the database is provided on purpose: without it the integration
        # tests skip themselves, and they are what covers concurrent
        # allocation and the wall between teams — Valkey likewise, for the
        # shared rate-limit counters
        run: go test -race -count=1 ./...
        env:
          PARAPHE_TEST_DATABASE_URL: postgresql://paraphe:paraphe@127.0.0.1:5432/paraphe_test
          PARAPHE_TEST_VALKEY_URL: valkey://127.0.0.1:6379

      - name: Bascule Sentinel
        # The HA claim, demonstrated rather than assumed: a primary, a
        # replica and a sentinel; counters written THROUGH the sentinel
        # address, the primary killed, and the same tests pass again once
        # the sentinel has promoted the replica. Counters restart at zero
        # across the failover — re-opened windows are the documented cost.
        run: |
          docker compose -f ../outils/sentinel-drill/compose.yml up -d --wait
          go test -race -count=1 -run 'TestValkeyCountsAtomicallyAndExpires|TestValkeyForgetResetsTheWindow|TestTwoInstancesShareOneCeiling' .
          docker kill sentinel-drill-primary
          # host networking gives every node one address: what moves on a
          # failover is the PORT the sentinel answers with (6380 → 6381)
          for i in $(seq 1 30); do
            port=$(docker exec sentinel-drill-sentinel valkey-cli -p 26379 \
              --no-auth-warning sentinel get-master-addr-by-name paraphe | sed -n 2p)
            if [ "$port" = "6381" ]; then break; fi
            if [ "$i" = 30 ]; then echo "::error::no failover after 30 s"; exit 1; fi
            sleep 1
          done
          go test -race -count=1 -run 'TestValkeyCountsAtomicallyAndExpires|TestValkeyForgetResetsTheWindow|TestTwoInstancesShareOneCeiling' .
          docker compose -f ../outils/sentinel-drill/compose.yml down
        env:
          PARAPHE_TEST_VALKEY_URL: valkey+sentinel://127.0.0.1:26379/paraphe
          PARAPHE_TEST_VALKEY_PASSWORD: drill

  interface:
    name: ⚛️ interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Types
        run: pnpm exec tsc --noEmit
      - name: Tests du moteur de messages
        # the central invariant: never claim an endorsement from someone
        # who made none
        run: pnpm test
      - run: pnpm build
        env:
          PARAPHE_BASE_PATH: /

  e2e:
    name: 🎭 journeys
    # The full journeys, in a browser: real database, real API, real built
    # interface. The only place where a JSON key renamed on one side and not
    # the other shows up — the unit suites stay green in that case, each
    # right on its own side.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paraphe
          POSTGRES_PASSWORD: paraphe
          POSTGRES_DB: paraphe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paraphe"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - run: pnpm exec playwright install --with-deps chromium

      - name: Parcours complets
        run: pnpm exec playwright test --config e2e/playwright.config.ts
        env:
          # the suite creates its own throwaway database from this account
          PARAPHE_TEST_DATABASE_URL: postgresql://paraphe:paraphe@127.0.0.1:5432/paraphe

      - name: Traces des échecs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces
          path: e2e/.results/
          retention-days: 7

  image:
    name: 🐳 image
    # checks the image actually builds and starts, without publishing it
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paraphe
          POSTGRES_PASSWORD: paraphe
          POSTGRES_DB: paraphe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paraphe"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Jeu de données minimal (les vraies sources ne sont pas versionnées)
        run: node outils/faux-jeu.ts out/

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Same cache scope as release.yml: a CI build warms what the
      # publication then reuses, instead of the two building twice.
      - name: Construire l'image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: paraphe:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # --read-only and NO tmpfs: the application writes nothing, and the
      # day it does this is where it shows, not on a cluster.
      - name: L'image démarre, sert les pages et le JSON, sans rien écrire
        run: |
          docker run -d --name paraphe --network host --read-only \
            -e PARAPHE_HOST=127.0.0.1 \
            -e PARAPHE_ADMIN_EMAIL=ci@exemple.fr \
            -e PARAPHE_ADMIN_PASSWORD=ci-motdepasse \
            -e PARAPHE_DATABASE_URL=postgresql://paraphe:paraphe@127.0.0.1:5432/paraphe \
            paraphe:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8047/api/config >/dev/null 2>&1; then
              echo "démarré au bout de ${i}s"; break
            fi
            if [ "$i" = 60 ]; then
              echo "rien n'a répondu en 60 s"; docker logs paraphe; exit 1
            fi
            sleep 1
          done
          # the liveness probe must not depend on the database
          curl -fsS http://127.0.0.1:8047/health | grep -q '"state":"ok"'
          # the pages, and the marker that keeps a volunteer out of browser
          # mode when /api/config has a bad minute
          curl -fsS http://127.0.0.1:8047/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8047/ | grep -q 'name="paraphe-mode" content="team"'
          # and the words a volunteer without JavaScript is left with
          curl -fsS http://127.0.0.1:8047/ | grep -q '<noscript>'
          # one page: a reload deep in the application renders it
          curl -fsS http://127.0.0.1:8047/equipe | grep -q 'id="root"'
          # the same process sets the page's security headers as the API's
          curl -fsSI http://127.0.0.1:8047/ | grep -qi 'content-security-policy'
          # the assets are precompressed, and served that way
          js=$(curl -fsS http://127.0.0.1:8047/ | grep -oE '/assets/[^"]+\.js' | head -1)
          curl -fsSI "http://127.0.0.1:8047$js" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          curl -fsS -H 'Accept-Encoding: br' -D- -o /dev/null \
            "http://127.0.0.1:8047$js" | grep -qi 'content-encoding: br'
          # sign-in works end to end
          curl -fsS -X POST http://127.0.0.1:8047/api/session \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@exemple.fr","password":"ci-motdepasse"}' \
            | grep -q '"role":"coordination"'
          # and without a session, nothing gets out
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8047/api/mayors)" = 401

      - name: Journaux du conteneur
        if: always()
        run: docker logs paraphe || true

  chart:
    name: ⎈ chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint du chart
        # helm lint files a {{ fail }} under INFO and exits 0: it proves
        # nothing alone. Neither does `helm template`: three misspelled probe
        # fields (periodSecond, failureThreshhold, httpsGet) passed the render
        # AND the grep. Only schema validation sees them.
        run: helm lint chart/paraphe

      - name: Installer kubeconform
        run: |
          curl -fsSL --retry 3 -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/

      - name: Les manifestes sont valides, dans plusieurs configurations
        run: |
          # the default path is not enough: ingress, autoscaling, existing
          # secret and external database are never rendered otherwise
          rendre() {
            nom=$1; shift
            helm template paraphe chart/paraphe \
              --set image.tag=ci --set secrets.adminPassword=x \
              --set secrets.secretKey=y --set secrets.valkeyPassword=w \
              --set postgres.cnpg.backup.acknowledgedDisabled=true \
              "$@" > "/tmp/$nom.yaml"
            test -s "/tmp/$nom.yaml"
            echo "--- $nom : $(grep -c '^kind:' "/tmp/$nom.yaml") ressources"
          }
          rendre defaut
          rendre ingress --set ingress.enabled=true \
            --set ingress.host=paraphe.exemple.fr --set ingress.tls.enabled=true
          rendre multi-campagnes --set ingress.enabled=true \
            --set ingress.tls.enabled=true \
            --set instance.baseDomain=paraphe.exemple.fr \
            --set instance.admin.email=admin@exemple.fr \
            --set secrets.instanceAdminPassword=z
          # the wildcard host IS the mechanism that opens a campaign:
          # without it, every approved campaign would require editing the
          # Ingress
          grep -q 'host: "\*.paraphe.exemple.fr"' /tmp/multi-campagnes.yaml
          # and it does not appear when the instance hosts a single campaign.
          # Written as an `if` and not as `! grep`: the `!` suspends errexit
          # for the command it negates, so this assertion passed whatever
          # the render contained — including a wildcard opening every
          # subdomain of a single-campaign instance.
          if grep -q 'host: "\*' /tmp/ingress.yaml; then
            echo "::error::a wildcard host on a single-campaign instance"
            exit 1
          fi
          rendre autoscaling --set autoscaling.enabled=true --set replicaCount=5
          rendre base-externe --set postgres.cnpg.enabled=false \
            --set postgres.external.existingSecret=ma-base
          rendre sauvegarde --set postgres.cnpg.backup.enabled=true \
            --set postgres.cnpg.backup.s3CredentialsSecret=mes-cles
          rendre sans-valkey --set valkey.enabled=false
          grep -q "kind: Deployment" /tmp/defaut.yaml
          # ONE application container, and no volume: nothing is written to
          # disk, and a mount reappearing means something is again. Judged
          # on the valkey-less render, because the valkey pods DO mount —
          # tmpfs only, for a config that carries a password and counters
          # that are disposable; the assertions below hold that line.
          if [ "$(grep -c 'volumeMounts:' /tmp/sans-valkey.yaml)" != 0 ]; then
            echo "::error::a volume is mounted again — the application writes nothing"
            exit 1
          fi
          # Valkey by default: present, walled off, and DISKLESS. Storage
          # appearing under it means counters started living somewhere a
          # failover is supposed to be allowed to lose — and the valkey
          # configuration, which carries the password, started living on a
          # disk. Every way of writing that is refused BY NAME, because a
          # guard that watches one of four doors watches none: a `hostPath`
          # and a `volumeClaimTemplates` each walked past a check that only
          # knew the string "PersistentVolumeClaim", with the emptyDir count
          # still matching.
          grep -q "kind: StatefulSet" /tmp/defaut.yaml
          grep -q "kind: NetworkPolicy" /tmp/defaut.yaml
          for forbidden in PersistentVolumeClaim volumeClaimTemplates: hostPath: nfs: csi:; do
            if grep -q "$forbidden" /tmp/defaut.yaml; then
              echo "::error::$forbidden under Valkey — its counters are disposable by design"
              exit 1
            fi
          done
          if [ "$(grep -c 'emptyDir:' /tmp/defaut.yaml)" != "$(grep -c 'medium: Memory' /tmp/defaut.yaml)" ]; then
            echo "::error::a Valkey emptyDir left tmpfs — its config carries the password"
            exit 1
          fi
          # CloudNativePG CRDs: kubeconform does not know them, skip them
          # multi-campagnes included: it is the render that adds the
          # wildcard Ingress, the instance administrator's env references and
          # the third secret key — the most likely of the six to carry a
          # misspelt field, and the one that was not validated.
          kubeconform -strict -summary \
            -ignore-missing-schemas -skip Cluster,ScheduledBackup \
            /tmp/defaut.yaml /tmp/ingress.yaml /tmp/multi-campagnes.yaml \
            /tmp/autoscaling.yaml /tmp/base-externe.yaml /tmp/sauvegarde.yaml \
            /tmp/sans-valkey.yaml
