name: 📦 Release

# Publishes the image and the chart to ghcr.io in OCI format.
# Triggered by a `v*` tag (e.g. v1.0.0); the chart version and the image
# tag derive from it, so a deployment is always traceable.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (sans le v), ex. 1.0.0"
        required: true

permissions:
  # contents: write and not read — the GitHub release is created HERE and
  # not by release-it, so the token never has to leave CI.
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Publishing without checking is exactly how an image that does not start
  # would reach production. What changed is WHICH check: this job used to
  # call ci.yml and run the whole suite a second time.
  #
  # `task release` pushes the commit and the tag TOGETHER, so the push
  # started a CI run and the tag started this one — the same seven jobs,
  # twice, on the same commit, at the same moment, competing for runners on
  # an account that has a handful. The release copy lost twice in a row:
  # v0.8.0 died on the lint's timeout at 10m15s, v0.8.1 on `playwright
  # install --with-deps` hanging past 25 minutes, while each one's twin went
  # green in about four. Two tags exist that published nothing.
  #
  # So the release WAITS for the run that already exists rather than opening
  # a second one. It is also a stronger statement than the old shape made:
  # what gates the publication is now a green CI on this exact commit, the
  # one whose result the repository keeps, rather than a private copy that
  # nobody else ever sees.
  verifier:
    name: ✅ the CI that ran on this commit
    runs-on: ubuntu-latest
    # Well past the CI's own ceilings (25 minutes for the longest job): this
    # job must outlive what it waits for, or it becomes the new race.
    timeout-minutes: 45
    permissions:
      # read the runs of this repository, and nothing else. No checkout: the
      # question is answered entirely by the API.
      actions: read
    steps:
      - name: Attendre la CI de ce commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Newest first, which is the API's default ordering. A re-run does
          # not create a run: it moves this one back to in_progress, so the
          # loop below sees a re-run as "not settled yet" and waits for it.
          etat() {
            gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"'
          }
          # The two runs are triggered by one push, so this one can be a few
          # seconds ahead of the run it is looking for. Absence is only an
          # answer after that.
          patience=300
          debut=$SECONDS
          while :; do
            runs=$(etat)
            if [ -z "$runs" ]; then
              if [ $((SECONDS - debut)) -lt "$patience" ]; then
                echo "aucune exécution de la CI pour $SHA — attente…"
                sleep 15
                continue
              fi
              echo "::error::aucune exécution de la CI pour le commit $SHA."
              echo "::error::Rien n'a vérifié ce code : publier maintenant"
              echo "::error::mettrait en production un artefact que rien n'a lu."
              echo "::error::Le tag doit porter sur un commit poussé sur main."
              exit 1
            fi
            if printf '%s\n' "$runs" \
              | grep -qE '^(queued|in_progress|waiting|requested|pending) '; then
              echo "la CI de ce commit tourne encore — attente…"
              sleep 20
              continue
            fi
            break
          done
          # Settled. The MOST RECENT run decides: a re-run that went red
          # after a green one is the answer that counts, and reading "any
          # green in the list" would publish on a result somebody has since
          # replaced.
          derniere=$(etat | head -n 1)
          conclusion=$(printf '%s' "$derniere" | cut -d' ' -f2)
          url=$(printf '%s' "$derniere" | cut -d' ' -f3)
          if [ "$conclusion" != "success" ]; then
            echo "::error::la CI de ce commit s'est terminée en « $conclusion »."
            echo "::error::$url"
            echo "::error::Relancer la CI, puis relancer cette publication."
            exit 1
          fi
          echo "CI verte sur ce commit : $url"

  publier:
    name: 📦 publish the image and the chart
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24: TypeScript type stripping is native, the tools run without
          # compilation
          node-version: 24

      - name: Déterminer la version
        id: v
        # Through `env`, never spliced into the script: GitHub substitutes an
        # expression as raw TEXT before bash parses the line, so a dispatch
        # input carrying `$(…)` or `";…"` runs as a command — and it runs
        # BEFORE the guard below reads package.json, which is the one file
        # the guard compares against. The shape is checked too: whatever
        # survives must still look like a version.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DEPOT: ${{ github.repository }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$'; then
            echo "::error::version illisible : $v (attendu x.y.z)"
            exit 1
          fi
          # The tag is the source of the image tag AND of the chart version.
          # A tag that does not name what the repository says it is would
          # publish paraphe:1.2.0 built from a tree calling itself 1.1.0,
          # and nothing downstream could tell. outils/version.test.ts holds
          # the other half: the files agree among themselves.
          declared=$(jq -r .version package.json)
          if [ "$v" != "$declared" ]; then
            echo "::error::le tag dit $v, package.json dit $declared."
            echo "::error::Publier créerait une version que le dépôt ne porte pas."
            echo "::error::Utiliser 'task release -- $v' plutôt qu'un tag posé à la main."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "depot=$(printf '%s' "$DEPOT" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Jeu de données minimal
        # the real lists regenerate with `task all` from the open sources;
        # the published image embeds a bootstrap set the operator replaces by
        # rebuilding the image.
        run: node outils/faux-jeu.ts out/

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Connexion à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ONE image: it serves the pages and the JSON from one process, so
      # there is no interface version and API version to keep in step. The
      # cache scope is the one ci.yml warms, so this reuses what the
      # verification just built instead of building it twice.
      - name: Construire et pousser l'image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.v.outputs.depot }}:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.v.outputs.depot }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Empaqueter et pousser le chart (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm package chart/paraphe \
            --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}"
          helm push "paraphe-${{ steps.v.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ steps.v.outputs.depot }}/charts"

      - name: Créer la release GitHub
        # Created here rather than by release-it: the token stays in CI and
        # never has to be read out of a local gh configuration.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.v.outputs.version }}"
          d="${{ steps.v.outputs.depot }}"
          {
            echo "Image et chart publiés sous la même version, dérivée de ce tag."
            echo ""
            echo "- Image — \`ghcr.io/$d:$v\` (amd64)"
            echo "- Chart OCI — \`oci://ghcr.io/$d/charts/paraphe\`, version \`$v\`"
            echo "- Version navigateur — https://jo-rackham.github.io/paraphe/"
          } > notes.md
          gh release create "v$v" --title "paraphe v$v" --notes-file notes.md \
            --verify-tag

      - name: Récapitulatif
        run: |
          v="${{ steps.v.outputs.version }}"
          d="${{ steps.v.outputs.depot }}"
          {
            echo "### Publié"
            echo ""
            echo '```bash'
            echo "helm install paraphe oci://ghcr.io/$d/charts/paraphe --version $v \\"
            echo "  --set secrets.adminPassword=… \\"
            echo "  --set secrets.secretKey=\$(openssl rand -hex 32) \\"
            echo "  --set secrets.valkeyPassword=\$(openssl rand -hex 24) \\"
            echo "  --set postgres.cnpg.backup.enabled=true --set postgres.cnpg.backup.s3CredentialsSecret=…"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
