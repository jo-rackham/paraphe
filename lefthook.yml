# Git hooks. Every command goes through the Taskfile, never duplicated here:
# an invocation living in a hook AND in the CI AND in the documentation
# diverges, and the one that diverges is always the one nobody runs.
#
# Jo's git configuration sets core.hooksPath globally, so `lefthook install`
# is not what wires this up — the global hook already calls `lefthook run`,
# and it finds this file. What IS needed is lefthook on the PATH, which
# devbox provides (direnv loads it on entering the directory). Outside that
# environment the hook says so and lets the commit through, rather than
# blocking a commit for want of a linter.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,json}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: gofmt
      glob: "api/*.go"
      run: gofmt -l -w {staged_files}
      stage_fixed: true

    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}

    - name: hadolint
      glob: "**/Dockerfile*"
      run: hadolint {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

    - name: yamllint
      glob: "*.{yml,yaml}"
      run: yamllint {staged_files}

# The whole suite before anything leaves the machine. A hook that only ever
# checks the files of one commit cannot see a change that breaks something
# it did not touch.
pre-push:
  jobs:
    - name: lint
      run: task lint
