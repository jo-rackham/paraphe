apiVersion: v2
name: paraphe
description: Outillage de recherche de parrainages d'élus — app d'équipe, données publiques
type: application
# `lifecycle.preStop.sleep` est bêta et ACTIF PAR DÉFAUT à partir de 1.30
# (en 1.29 il est alpha, donc désactivé) : sans cette borne, helm installe
# sur un cluster où l'API retire le champ en silence — le pod reçoit
# SIGTERM pendant qu'on lui envoie encore des requêtes, ce que le champ est
# là pour empêcher. Un refus à l'installation vaut mieux qu'un drain qui
# n'a jamais eu lieu.
kubeVersion: ">=1.30.0-0"
version: 0.15.0
appVersion: "0.15.0"
home: https://github.com/jo-rackham/paraphe
sources:
  - https://github.com/jo-rackham/paraphe
keywords:
  - elections
  - parrainages
  - open-data
maintainers:
  - name: Jo Rackham
