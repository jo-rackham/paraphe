{{- if .Values.ingress.enabled }}
{{- $hotes := list .Values.ingress.host }}
{{- if .Values.instance.baseDomain }}
{{- /*
  Multi-campagnes : un hôte GÉNÉRIQUE sert toutes les campagnes. Sans lui, il
  faudrait modifier l'Ingress à chaque campagne ouverte — donc donner à
  l'application un accès en écriture à l'API Kubernetes, ou faire dépendre
  l'ouverture d'une intervention manuelle. Le générique DNS ne couvre qu'un
  niveau, ce que la résolution applique aussi (cf. PerimetreDeHote).
*/}}
{{- $hotes = append $hotes (printf "*.%s" .Values.instance.baseDomain) }}
{{- end }}
{{- $hotes = concat $hotes .Values.ingress.hotesSupplementaires | uniq }}
{{- /* L'hôte média a sa propre règle plus bas ; il rejoint la liste TLS
       ici, car un certificat par hôte est ce que cert-manager attend. */}}
{{- $hotesTls := $hotes }}
{{- if and .Values.media.enabled .Values.garage.enabled }}
{{- $hotesTls = append $hotesTls .Values.media.host | uniq }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "paraphe.nomComplet" . }}
  labels: {{- include "paraphe.etiquettes" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hotesTls }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "paraphe.nomComplet" .)) }}
  {{- end }}
  rules:
    {{- range $hotes }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "paraphe.nomComplet" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
    {{- if and .Values.media.enabled .Values.garage.enabled }}
    {{/*
      L'origine média : son propre hôte, routé vers l'endpoint web de
      Garage et non vers l'application. C'est tout l'arbitrage — le
      navigateur télécharge les logos depuis le stockage, directement.

      Un hôte à part et non un chemin : une origine distincte est ce qui
      met un éventuel SVG hostile hors de portée du cookie de session, qui
      est host-only. Sous /media/ du même hôte, il serait chez lui.
    */}}
    - host: {{ .Values.media.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "paraphe.nomGarage" . }}-web
                port:
                  number: 3902
    {{- end }}
{{- end }}
