{{/*
  This guard holds WHATEVER the source of the secret. Placed inside the
  `not existingSecret` branch, it let a multi-campaign instance render with
  no instance administrator at all — the hosting requests then pile up
  behind someone nobody can sign in as. What the chart CANNOT check is the
  content of an existing Secret: the three keys it must carry are spelled
  out in values.yaml, because a missing one surfaces as
  CreateContainerConfigError with no pod ever ready.
*/}}
{{- if and .Values.instance.baseDomain (not .Values.instance.admin.email) }}
{{- fail "instance.admin.email est obligatoire dès que instance.baseDomain est renseigné." }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.adminPassword }}
{{- fail "secrets.adminPassword est obligatoire : sans compte de coordination, personne ne peut entrer dans l'application. Passez --set secrets.adminPassword=… ou secrets.existingSecret=…" }}
{{- end }}
{{- if and .Values.instance.baseDomain (not .Values.secrets.instanceAdminPassword) }}
{{- fail "secrets.instanceAdminPassword est obligatoire dès que instance.baseDomain est renseigné : sans administration d'instance, les demandes d'hébergement s'accumulent sans que personne puisse les valider." }}
{{- end }}
{{- if and .Values.instance.baseDomain (not .Values.instance.admin.email) }}
{{- fail "instance.admin.email est obligatoire dès que instance.baseDomain est renseigné." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paraphe.nomComplet" . }}
  labels: {{- include "paraphe.etiquettes" . | nindent 4 }}
type: Opaque
stringData:
  PARAPHE_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- if .Values.instance.baseDomain }}
  PARAPHE_INSTANCE_ADMIN_PASSWORD: {{ .Values.secrets.instanceAdminPassword | quote }}
  {{- end }}
  # Always provided. Without it, the application draws one at first
  # start — which forces it to reach the database at import time and kills
  # a pod restarted during a database outage. Kept across upgrades through
  # lookup, otherwise sessions would drop.
  PARAPHE_SECRET_KEY: {{ .Values.secrets.secretKey
    | default (get ((lookup "v1" "Secret" .Release.Namespace (include "paraphe.nomComplet" .)).data | default dict) "PARAPHE_SECRET_KEY" | b64dec)
    | default (randAlphaNum 48) | quote }}
  {{- if .Values.valkey.enabled }}
  # Same lookup dance: regenerated on every upgrade, the valkey pods and
  # the application would restart out of step, each side refusing the
  # other's password until the rollout converges.
  PARAPHE_VALKEY_PASSWORD: {{ .Values.secrets.valkeyPassword
    | default (get ((lookup "v1" "Secret" .Release.Namespace (include "paraphe.nomComplet" .)).data | default dict) "PARAPHE_VALKEY_PASSWORD" | b64dec)
    | default (randAlphaNum 48) | quote }}
  {{- end }}
{{- end }}
