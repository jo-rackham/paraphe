{{/*
  This guard holds WHATEVER the source of the secret. Placed inside the
  `not existingSecret` branch, it let a multi-campaign instance render with
  no instance administrator at all — the hosting requests then pile up
  behind someone nobody can sign in as. What the chart CANNOT check is the
  content of an existing Secret: the three keys it must carry are spelled
  out in values.yaml, because a missing one surfaces as
  CreateContainerConfigError with no pod ever ready.
*/}}
{{- if and .Values.instance.baseDomain (not .Values.instance.admin.email) }}
{{- fail "instance.admin.email est obligatoire dès que instance.baseDomain est renseigné." }}
{{- end }}
{{/*
  Les trois réglages du courriel tiennent ensemble, et la vérification est
  ici plutôt que dans l'application seule : à moitié renseignés, les pods
  refusent de démarrer, et ce refus se lit dans `kubectl logs` d'un pod en
  CrashLoopBackOff pendant qu'ArgoCD affiche « Progressing » — alors que le
  chart peut le dire au rendu, là où la personne qui a fait la faute regarde.
*/}}
{{- if .Values.mail.url }}
{{- if not .Values.mail.from }}
{{- fail "mail.from est obligatoire dès que mail.url est renseignée : tout message a besoin d'un expéditeur. Donnez l'adresse que verront les bénévoles, par exemple `Campagne <contact@exemple.fr>`." }}
{{- end }}
{{- if not .Values.mail.publicUrl }}
{{- fail "mail.publicUrl est obligatoire dès que mail.url est renseignée : les liens des emails en sont construits, et jamais de l'en-tête Host — que n'importe qui peut poser vers son propre serveur. Donnez l'origine que les bénévoles tapent dans leur navigateur, par exemple https://paraphe.org." }}
{{- end }}
{{/*
  Le garde doit refuser CE QUE L'APPLICATION REFUSE, ni plus ni moins.
  `parsePublicURL` (api/mail.go) coupe les blancs, laisse `url.Parse`
  minusculer le schéma, et refuse un chemin, une requête, un fragment ou une
  userinfo. D'où le `trim`, le `(?i)`, et le `@` exclu : plus strict, on
  bloque un déploiement légitime, ce qui est le pire échec de ce fichier.
*/}}
{{- if not (regexMatch "^(?i)https?://[^/?#@\\s]+/?$" (trim .Values.mail.publicUrl)) }}
{{- fail (printf "mail.publicUrl vaut %q, et l'application refusera de démarrer avec : c'est une ORIGINE, donc un schéma et un hôte, sans chemin, requête, fragment ni identifiants — les liens sont construits en y ajoutant /connexion. Par exemple https://paraphe.org." .Values.mail.publicUrl) }}
{{- end }}
{{- end }}
{{/*
  La même origine, pour le magasin d'objets : elle entre dans le img-src de
  la Content-Security-Policy, où un point-virgule ferme la source et en ouvre
  une autre. `MediaOrigin` (api/media.go) refuse exactement " \t\r\n;,'\"".

  Sur la valeur COMPOSÉE, pas sur le réglage : quand media.publicUrl est vide
  — le cas par DÉFAUT — l'origine est fabriquée à partir de media.host, que ce
  garde ne regardait pas. Un point-virgule dans media.host rendait donc
  tranquillement, et l'application refusait de démarrer.
*/}}
{{- $origineMedia := trim (include "paraphe.urlPubliqueMedia" .) }}
{{- if and .Values.media.enabled (not (regexMatch "^(?i)https?://[^/?#@\\s;,'\"]+/?$" $origineMedia)) }}
{{- fail (printf "l'origine du magasin d'objets vaut %q, et l'application refusera de démarrer avec : c'est une ORIGINE, et elle entre dans la Content-Security-Policy — ni chemin, ni requête, ni identifiants, ni espace, ni point-virgule, ni virgule, ni guillemet. Corrigez media.publicUrl, ou media.host dont elle est composée." $origineMedia) }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.adminPassword }}
{{- fail "secrets.adminPassword est obligatoire : sans compte de coordination, personne ne peut entrer dans l'application. Passez --set secrets.adminPassword=… ou secrets.existingSecret=…" }}
{{- end }}
{{- if and .Values.instance.baseDomain (not .Values.secrets.instanceAdminPassword) }}
{{- fail "secrets.instanceAdminPassword est obligatoire dès que instance.baseDomain est renseigné : sans administration d'instance, les demandes d'hébergement s'accumulent sans que personne puisse les valider." }}
{{- end }}
{{- if and .Values.instance.baseDomain (not .Values.instance.admin.email) }}
{{- fail "instance.admin.email est obligatoire dès que instance.baseDomain est renseigné." }}
{{- end }}
{{/*
  Resolved here, and checked with an `if`: `default (fail "…")` reads well
  and does not work — Go templates evaluate a pipeline's arguments before
  the function that would discard them, so the `fail` fires even when the
  value is set.
*/}}
{{- $secretKey := .Values.secrets.secretKey | default (get ((lookup "v1" "Secret" .Release.Namespace (include "paraphe.nomComplet" .)).data | default dict) "PARAPHE_SECRET_KEY" | b64dec) }}
{{- if not $secretKey }}
{{- fail "secrets.secretKey est obligatoire : il signe toutes les sessions. Le chart ne peut pas en tirer un au hasard — en rendu client (helm template, ArgoCD par défaut), il ne relit pas le Secret déjà en place et en tirerait un NOUVEAU à chaque synchronisation, déconnectant tous les bénévoles. Passez --set secrets.secretKey=$(openssl rand -hex 64), ou secrets.existingSecret=… (ExternalSecret, SealedSecret, SOPS)." }}
{{- end }}
{{- if lt (len $secretKey) 32 }}
{{- fail (printf "secrets.secretKey fait %d octets, et l'application refusera de démarrer en dessous de 32 : une clé courte, c'est un cookie capturé qui devient une recherche hors ligne. Passez --set secrets.secretKey=$(openssl rand -hex 64)." (len $secretKey)) }}
{{- end }}
{{- $valkeyPassword := "" }}
{{- if .Values.valkey.enabled }}
{{- $valkeyPassword = .Values.secrets.valkeyPassword | default (get ((lookup "v1" "Secret" .Release.Namespace (include "paraphe.nomComplet" .)).data | default dict) "PARAPHE_VALKEY_PASSWORD" | b64dec) }}
{{- if not $valkeyPassword }}
{{- fail "secrets.valkeyPassword est obligatoire dès que valkey.enabled : tiré au hasard, il serait retiré à chaque rendu client et l'application et les pods valkey se refuseraient mutuellement, le rate-limiting comptant par instance pendant ce temps. Passez --set secrets.valkeyPassword=$(openssl rand -hex 32), ou secrets.existingSecret=…" }}
{{- end }}
{{- end }}
{{- $garageRpc := "" }}
{{- $garageAdmin := "" }}
{{- $mediaAccess := "" }}
{{- $mediaSecret := "" }}
{{- if .Values.media.enabled }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "paraphe.nomComplet" .)).data | default dict }}
{{- $mediaAccess = .Values.secrets.mediaAccessKey | default (get $existing "PARAPHE_MEDIA_ACCESS_KEY" | b64dec) }}
{{- $mediaSecret = .Values.secrets.mediaSecretKey | default (get $existing "PARAPHE_MEDIA_SECRET_KEY" | b64dec) }}
{{- if or (not $mediaAccess) (not $mediaSecret) }}
{{- fail "secrets.mediaAccessKey et secrets.mediaSecretKey sont obligatoires dès que media.enabled : ce sont les identifiants S3 avec lesquels l'application écrit les logos. Tirés au hasard, ils seraient retirés à chaque rendu client et l'application se verrait refuser l'accès au seau. Passez --set secrets.mediaAccessKey=GK$(openssl rand -hex 12) --set secrets.mediaSecretKey=$(openssl rand -hex 32), ou secrets.existingSecret=…" }}
{{- end }}
{{- if .Values.garage.enabled }}
{{- $garageRpc = .Values.secrets.garageRpcSecret | default (get $existing "PARAPHE_GARAGE_RPC_SECRET" | b64dec) }}
{{- $garageAdmin = .Values.secrets.garageAdminToken | default (get $existing "PARAPHE_GARAGE_ADMIN_TOKEN" | b64dec) }}
{{- if or (not $garageRpc) (not $garageAdmin) }}
{{- fail "secrets.garageRpcSecret et secrets.garageAdminToken sont obligatoires dès que garage.enabled : le premier authentifie les nœuds entre eux, le second l'amorçage. Le rendu client ne relit pas le Secret en place et en tirerait de nouveaux à chaque synchronisation — le cluster se scinderait. Passez --set secrets.garageRpcSecret=$(openssl rand -hex 32) --set secrets.garageAdminToken=$(openssl rand -hex 32)" }}
{{- end }}
{{- if ne (len $garageRpc) 64 }}
{{- fail "secrets.garageRpcSecret doit faire exactement 64 caractères hexadécimaux (32 octets) : Garage refuse toute autre longueur, et les pods redémarrent en boucle sur un message que seuls leurs logs portent. openssl rand -hex 32" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paraphe.nomComplet" . }}
  labels: {{- include "paraphe.etiquettes" . | nindent 4 }}
type: Opaque
stringData:
  PARAPHE_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- if .Values.instance.baseDomain }}
  PARAPHE_INSTANCE_ADMIN_PASSWORD: {{ .Values.secrets.instanceAdminPassword | quote }}
  {{- end }}
  # Set explicitly, or read back from the Secret already in place. Without
  # it, the application draws one at first start — which forces it to reach
  # the database at import time and kills a pod restarted during a database
  # outage. The lookup is what keeps sessions alive across an upgrade.
  PARAPHE_SECRET_KEY: {{ $secretKey | quote }}
  {{- if .Values.valkey.enabled }}
  # Same dance: regenerated behind the application's back, the valkey pods
  # and the application restart out of step, each side refusing the other's
  # password until the rollout converges — and the rate limiter counts per
  # instance meanwhile, silently multiplying every ceiling.
  PARAPHE_VALKEY_PASSWORD: {{ $valkeyPassword | quote }}
  {{- end }}
  {{- if .Values.media.enabled }}
  # The S3 pair the application signs its writes with. Read back from the
  # Secret in place for the same reason as the two above: regenerated behind
  # the store's back, every upload answers 403 and the only sign is a line
  # in the application's log.
  PARAPHE_MEDIA_ACCESS_KEY: {{ $mediaAccess | quote }}
  PARAPHE_MEDIA_SECRET_KEY: {{ $mediaSecret | quote }}
  {{- if .Values.garage.enabled }}
  # Between the nodes, and for the bootstrap Job. A new RPC secret at every
  # sync would leave the three pods unable to authenticate each other: the
  # cluster splits, and the logos stop being served.
  PARAPHE_GARAGE_RPC_SECRET: {{ $garageRpc | quote }}
  PARAPHE_GARAGE_ADMIN_TOKEN: {{ $garageAdmin | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.mail.url }}
  # Kept out of mail.url on purpose: a URL travels into logs, into a
  # `describe pod` and into the paste of a support thread, and a password
  # inside it travels with it. Empty is legitimate — a relay that asks for no
  # authentication — and the application refuses a password with no user to
  # carry it rather than dropping it silently.
  PARAPHE_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
{{- end }}
